<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ending A · Panorama band</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#e9e7e1}svg{display:block;width:min(100vw,1360px);height:auto;margin:0 auto;background:#f7f6f2;font-family:'Noto Sans',sans-serif}</style></head>
<body><!-- 340 x 300 mm tile, 1 unit = 1 mm. Serve from repo root so ../../../private/images resolves. -->
<svg id="s" viewBox="0 0 340 300" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// Shared by ending-A/B/C.html (inlined into each at build time by gen_endings.py).
// Units: 1 SVG unit = 1 mm. Tile 340 x 300 mm. Palette = v5 A0.C. Type sizes follow PRINT_SPEC.md.
const C={ink:'#1d1d1b',g1:'#3d3c39',g2:'#6e6c67',g3:'#a3a19b',g4:'#c8c6bf',g5:'#e2e0d9',paper:'#f7f6f2',card:'#fbfaf7',
  future:'#f2efe6',gold:'#c99512',goldD:'#7a5a00',red:'#c0392b',blueN:'#1f5fa8',violet:'#6a3d9a',green:'#2e8b57'};
const TS={land:6.0,t1:3.9,t2:3.4,meta:2.8,cap:4.2,kick:3.2};
// Future milestones, data/merged/timeline.json category future.prophecy, start.sort_key order 100001-100017
// (b12-0119 merged into b10-0011, b12-0120 into b10-0019, b12-0121 into b10-0020).
const PRE=[
 ['b10-0009','“Peace and security!”','1Th 5:3'],
 ['b10-0010','Final sealing of the anointed','Re 7:1-3'],
 ['b10-0011','Attack on Babylon the Great','Re 17:16'],
 ['b10-0012','Attack “cut short”','Mt 24:22'],
 ['b10-0013','Signs in sun, moon and stars','Mt 24:29'],
 ['b10-0014','Sign of the Son of man; sheep and goats judged','Mt 24:30; 25:31-33'],
 ['b10-0015','Attack by Gog of Magog','Eze 38:10-12'],
 ['b10-0016','Remaining anointed gathered to heaven','Mt 24:31']];
const ARM=['b10-0017','War of Armageddon','Re 16:14, 16'];
const POST=[
 ['b10-0018','Marriage of the Lamb','Re 19:9'],
 ['b10-0019','Satan and the demons abyssed','Re 20:1-3'],
 ['b10-0020','Christ’s Thousand Year Reign begins','Re 20:4, 6'],
 ['b10-0021','Earthly resurrection','Ac 24:15'],
 ['b10-0022','New scrolls opened','Re 20:12, 13'],
 ['b10-0023','Christ hands the Kingdom back to God','1Co 15:24-28'],
 ['b10-0024','Satan released; the final test','Re 20:7-9'],
 ['b10-0025','Satan, demons and rebels destroyed forever','Re 20:10']];
const IMG='../../../private/images/';
const F="'Noto Sans',sans-serif";
const n=v=>Math.round(v*100)/100;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const at=o=>Object.entries(o).filter(([,v])=>v!=null&&v!==false).map(([k,v])=>` ${k.replace(/_/g,'-')}="${typeof v==='number'?n(v):v}"`).join('');
const HALO={stroke:C.paper,stroke_width:0.7,paint_order:'stroke',stroke_linejoin:'round'};
let OUT=[];
const el=(t,o,inner)=>OUT.push(`<${t}${at(o)}>${inner||''}</${t}>`);
const text=(x,y,s,fs,o={})=>el('text',Object.assign({x,y,font_size:fs},o),esc(s));
const rect=(x,y,w,h,fill,o={})=>el('rect',Object.assign({x,y,width:w,height:h,fill},o));
const line=(x1,y1,x2,y2,stroke,w,o={})=>el('line',Object.assign({x1,y1,x2,y2,stroke,stroke_width:w},o));
const path=(d,stroke,w,o={})=>el('path',Object.assign({d,stroke,stroke_width:w,fill:'none'},o));
const circ=(cx,cy,r,fill,o={})=>el('circle',Object.assign({cx,cy,r,fill},o));
const img=(x,y,w,h,href,o={})=>el('image',Object.assign({x,y,width:w,height:h,href,preserveAspectRatio:'xMidYMid slice'},o));
// station glyph: ring with white core (min Ø 2.4 mm), big = Ø 3.6 mm
const st=(x,y,big,col)=>{circ(x,y,big?1.8:1.2,C.card,{stroke:col||C.ink,stroke_width:big?0.6:0.45})};
// two-line label: title (bold) + meta (ref) ; anchor start|end|middle
const lab=(x,y,t,ref,anc,o={})=>{const fs=o.fs||TS.t2,fill=o.fill||C.ink,mf=o.mfill||C.g1;
  text(x,y,t,fs,Object.assign({text_anchor:anc||'start',fill,font_weight:o.w||700},o.halo===false?{}:HALO));
  if(ref)text(x,y+fs*0.95+0.4,ref,TS.meta,Object.assign({text_anchor:anc||'start',fill:mf},o.halo===false?{}:HALO))};
const medallion=(cx,cy,r,href,id,ring)=>{OUT.push(`<clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>`);
  circ(cx,cy,r+0.9,C.paper,{stroke:ring||C.gold,stroke_width:0.6});img(cx-r,cy-r,2*r,2*r,href,{clip_path:`url(#${id})`})};
const fin=(svg,defs)=>{svg.innerHTML=(defs||'')+OUT.join('');document.fonts&&document.fonts.ready.then(()=>{})};
function wrap(s,max){const w=s.split(' '),L=[];let c='';w.forEach(x=>{if((c+' '+x).trim().length>max&&c){L.push(c);c=x}else c=(c+' '+x).trim()});if(c)L.push(c);return L}
// ---- blending + texture (see V6_PLAN.md §Images & empty space)
const TEXTURE=`<filter id="warm" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.93 0.05 0.02 0 0.02  0.03 0.90 0.03 0 0.02  0.02 0.05 0.80 0 0.01  0 0 0 1 0"/></filter>
<filter id="grainF" x="0" y="0" width="1" height="1"><feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 0.54  0 0 0 0 0.45  0 0 0 0 0.30  0 0 0 0.9 -0.42"/></filter>
<pattern id="grain" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" filter="url(#grainF)" opacity="0.35"/></pattern>
<pattern id="contour" width="40" height="14" patternUnits="userSpaceOnUse"><path d="M0 7 C10 2 20 12 40 7 M0 13 C12 9 22 16 40 12" fill="none" stroke="#c99512" stroke-width="0.25" opacity="0.18"/></pattern>
<radialGradient id="vig"><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>`;
// feathered, warm-toned circular vignette: no ring, edge fades over the outer 45% of the radius into the paper
const vignette=(cx,cy,r,href,id)=>{OUT.push(`<mask id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#vig)"/></mask>`);
  el('g',{mask:`url(#${id})`,opacity:0.92},`<image filter="url(#warm)" x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" href="${href}" preserveAspectRatio="xMidYMid slice"/>`)};

// A · PANORAMA: row 4 arrives from the right, drops at Armageddon, the Reign is a gold band laid over a full-width paradise panorama
const defs=`<defs><linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".22" stop-color="#fff" stop-opacity="1"/></linearGradient>
<mask id="mT"><rect x="0" y="128" width="340" height="172" fill="url(#fadeT)"/></mask><mask id="mS"><rect x="0" y="128" width="340" height="172" fill="url(#fadeS)"/></mask><linearGradient id="fadeS" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset=".07" stop-color="#fff"/><stop offset=".93" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>${TEXTURE}<linearGradient id="wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f6f2" stop-opacity=".55"/><stop offset=".5" stop-color="#f2e3b8" stop-opacity=".18"/><stop offset="1" stop-color="#f7f6f2" stop-opacity=".35"/></linearGradient>
<linearGradient id="reign" x1="0" x2="1"><stop offset="0" stop-color="#e2b23a"/><stop offset=".5" stop-color="#f3d27a"/><stop offset="1" stop-color="#e2b23a"/></linearGradient>
<linearGradient id="trib" x1="0" x2="1"><stop offset="0" stop-color="#cfccc4"/><stop offset="1" stop-color="#e2e0d9"/></linearGradient></defs>`;
rect(0,0,340,300,C.paper);rect(0,0,340,300,'url(#grain)');
text(330,262,'1,000',64,{text_anchor:'end',fill:C.gold,opacity:0.07,font_weight:800});
rect(36,64,300,40,'url(#contour)',{opacity:1});
text(10,13,'THE FUTURE · IN THE ORDER JW.ORG GIVES',TS.kick,{fill:C.g2,font_weight:800,letter_spacing:0.3});
text(10,21.5,'Through the great tribulation into Paradise',TS.land,{fill:C.ink,font_weight:800});
// tribulation bed + incoming rails (right → left, as row 4 runs)
rect(36,38,300,24,'url(#trib)',{rx:3});
text(40,44.2,'GREAT TRIBULATION · Mt 24:21, 22',TS.kick-0.4,{fill:C.g2,font_weight:800,letter_spacing:0.3});
[[C.red,-4],[C.blueN,4],[C.ink,7]].forEach(([c,o])=>line(40,50+o,340,50+o,c,0.6,{opacity:0.55}));
line(28,50,340,50,C.gold,2.2);
const xs=PRE.map((_,i)=>322-i*38.5);
PRE.forEach((p,i)=>{const x=xs[i],up=i%2===0;st(x,50,i===2||i===5);
  const y=up?31.5-0:70.5;line(x,up?48.2:51.8,x,up?y+1.2:y-3.6,C.g3,0.25);
  const t=p[1].length>28?p[1].replace(/; /,';\n').split('\n'):[p[1]];
  if(up){/* above: lines stacked upwards */ }
  t.forEach((s,j)=>text(x,(up?y-(t.length-1-j)*3.6:y+j*3.6),s,TS.t2,Object.assign({text_anchor:'middle',fill:C.ink,font_weight:700},HALO)));
  text(x,up?y+3.4-0.4+0.0+0:y+t.length*3.6,p[2],TS.meta,Object.assign({text_anchor:'middle',fill:C.g1},HALO));});
// Armageddon: the line drops down the left edge into the panorama
path('M28 50 C14 50 12 62 12 76 L12 118 C12 126 16 128 24 128',C.gold,2.2);
vignette(34,92,15,IMG+'ev-armageddon.jpg','arm');
text(52,88,'WAR OF ARMAGEDDON',TS.t1+0.6,Object.assign({fill:C.red,font_weight:800},HALO));
text(52,93.6,'the finale of the great tribulation · Re 16:14, 16',TS.meta,Object.assign({fill:C.g1},HALO));
// panorama
el('g',{mask:'url(#mS)'},`<g mask="url(#mT)"><image filter="url(#warm)" x="0" y="128" width="340" height="172" href="${IMG}paradise__alt1.jpg" preserveAspectRatio="xMidYMid slice" opacity="0.78"/></g>`);
rect(0,128,340,172,'url(#wash)');
// reign band over the sky
rect(24,121,312,14,'url(#reign)',{rx:7,stroke:C.goldD,stroke_width:0.4});
text(180,111,'CHRIST’S THOUSAND YEAR REIGN · 1,000 YEARS · Re 20:4-6',TS.t1+0.6,Object.assign({text_anchor:'middle',fill:C.goldD,font_weight:800,letter_spacing:0.3},HALO));
const px=POST.map((_,i)=>36+i*40.5);
POST.forEach((p,i)=>st(px[i],128,big(i),C.goldD));
// chips under the band, two lanes
POST.forEach((p,i)=>{const x=px[i],lane=i%2,t=wrap(p[1],22),h=t.length*3.7+4.2,y=140+lane*22,w=Math.max(...t.map(s=>s.length))*1.95+6;
  line(x,129.8,x,y,C.goldD,0.35);
  rect(x-w/2,y,w,h,C.card,{rx:1.6,opacity:0.94,stroke:C.gold,stroke_width:0.35});
  t.forEach((s,j)=>text(x,y+4.1+j*3.7,s,TS.t2,{text_anchor:'middle',fill:C.ink,font_weight:big(i)?800:700}));
  text(x,y+4.1+t.length*3.7-0.5,p[2],TS.meta,{text_anchor:'middle',fill:C.g1})});
function big(i){return i===2||i===3}
// caption card
rect(10,272,150,18,C.card,{rx:2,opacity:0.92});
text(15,280,'PARADISE ON EARTH',TS.cap+0.6,{fill:C.ink,font_weight:800,letter_spacing:0.3});
text(15,286,'Lu 23:43 · Re 21:3, 4 · Ps 37:10, 11',TS.meta+0.2,{fill:C.g1});

fin(document.getElementById('s'),defs);

</script></body></html>
